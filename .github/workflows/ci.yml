# Runs Munshi's test suite on every pull request to main and every push to main.
# Tests only: this workflow never deploys (Render deploys from main on its own).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer push to the same PR cancels the run it replaces; every commit to main keeps its run.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # No live services in CI. The tests stub Claude, WhatsApp and Sarvam and set their own
      # test-only values (in-memory database, fake WhatsApp secrets). This is a safety net so
      # that any code path a test does not stub can never call the Claude API.
      MUNSHI_LLM: "off"
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12 (same as the Dockerfile)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest -v
